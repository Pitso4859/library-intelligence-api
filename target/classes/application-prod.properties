# =============================================
# PRODUCTION PROFILE - Vercel + Supabase
# Optimized for Vercel's short container startup window.
# =============================================

# ---- PostgreSQL / Supabase ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Do not block application startup waiting for an initial DB connection.
# The pool establishes connections when an endpoint first needs the database.
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000

# ---- Fast JPA bootstrap ----
# Vercel needs the HTTP port to open quickly. Repositories and Hibernate
# are initialized lazily instead of delaying Tomcat startup.
spring.main.lazy-initialization=true
spring.data.jpa.repositories.bootstrap-mode=lazy
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# ---- Flyway ----
# The schema has already been created/validated on Supabase during previous
# deployments. Do not rerun migrations on every cold Vercel container start.
spring.flyway.enabled=false

# ---- Production-only startup reductions ----
spring.h2.console.enabled=false
spring.jmx.enabled=false
spring.main.banner-mode=off

# Keep the Vercel health check independent from database cold initialization.
management.health.db.enabled=false
management.endpoint.health.show-details=never

# Runtime diagnostics
logging.level.com.pitso=INFO
logging.level.org.springframework.boot=INFO
logging.level.com.zaxxer.hikari=WARN
logging.level.org.flywaydb=WARN
logging.level.org.hibernate=WARN
