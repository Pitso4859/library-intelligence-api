# =============================================
# PITSO BOOK SYSTEM - Application Configuration
# =============================================
spring.application.name=pitso-book-system
server.port=8080

# ---- Default (Dev) Profile: H2 in-memory ----
spring.datasource.url=jdbc:h2:mem:pitsodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway is enabled only in production; dev/test use disposable H2 schemas
spring.flyway.enabled=false

# H2 Console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- API Documentation ----
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
info.app.name=Pitso Book System
info.app.version=1.1.0

# ---- Logging ----
logging.level.com.pitso=INFO
logging.level.org.springframework.web=WARN
logging.pattern.console=%d{HH:mm:ss} [%-5level] %logger{36} - %msg%n
