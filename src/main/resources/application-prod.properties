# =============================================
# PRODUCTION PROFILE - PostgreSQL Configuration
# Activate with: --spring.profiles.active=prod
# Or set env: SPRING_PROFILES_ACTIVE=prod
# =============================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pitsodb}
spring.datasource.username=${DB_USERNAME:pitso}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway (for schema migrations in prod)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Disable H2 console
spring.h2.console.enabled=false

logging.level.com.pitso=WARN
